# ToolFlight -- Netlify deployment configuration.
#
# This site is pre-built static output: build.py is run locally/offline
# to generate every HTML page before deploying, so Netlify needs no build
# command here -- just tell it which directory to publish. Replace
# "toolflight-main" below with whatever directory actually contains the
# generated site (index.html, css/, js/, etc.) in your deploy setup.

[build]
  publish = "."

# Netlify's secrets scanner flags the Firebase Web apiKey in
# js/firebase-config.js ("AIza..." looks like a Google API key). It is a
# false positive here: Firebase Web config values are public identifiers
# that ship to every browser by design -- they identify the project, they
# do not authorize access. The real authorization boundary is
# firestore.rules (plus API-key restrictions in the Google Cloud Console),
# exactly as documented at the top of js/firebase-config.js.
#
# Scoped to that one file (and the build-agent scratch dir, which is not
# deployed content) rather than disabling smart detection site-wide, so
# scanning still protects every other file. Genuine secrets -- Firebase
# Admin SDK credentials, service-account keys -- must never live in this
# frontend, and none do.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/firebase-config.js,.netlify/**"

# Baseline security headers, worth having now that this site handles
# real authentication and business data (Invoice Maker), not just
# stateless client-side tools. These are defense-in-depth on top of --
# not a substitute for -- firestore.rules, which remains the actual
# authorization boundary for all Firestore data.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # camera=(self) is required for Passport Photo Maker's camera-capture
    # feature; everything else stays default-denied.

# Block server-side/developer files that have no place in the public site.
# build.py (445KB Python build script), pending Firestore rules, and all
# Markdown documentation files are development artifacts only. Returning 404
# means they cannot be read or harvested by bots even if they appear in a
# directory listing.
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/firestore.rules.PENDING-APPROVAL"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/firestore.indexes.json"
  to = "/404.html"
  status = 404

# Security header: Content-Security-Policy (permissive to allow CDN scripts,
# Firebase, Google Fonts, ONNX Runtime WASM, and Netlify Forms; tightened
# just enough to block inline script injection from XSS without breaking any
# existing tool)
#
# connect-src must list every origin the frontend fetch()es from, or the
# browser silently blocks the request (no network attempt is even made) and
# the page only sees a generic failed-fetch. https://toolflight-pdf2word.onrender.com
# is the PDF -> Word conversion backend (js/app.js, PDF2WORD_API / pdf-to-word.html)
# -- it was missing here, which is why that one tool's fetch() was blocked by
# CSP while every other tool kept working. Same class of bug found again for
# the AI Background Remover (image-tools.html / background-remover.html):
# script-src already allowed https://cdn.jsdelivr.net so the MediaPipe ESM
# import itself succeeded, but MediaPipe's FilesetResolver/ImageSegmenter then
# fetch() the WASM runtime from https://cdn.jsdelivr.net and the segmentation
# model from https://storage.googleapis.com -- neither origin was in
# connect-src, so those fetches were silently blocked by CSP and surfaced to
# the page as a generic "Failed to fetch", confirmed via bgDebugLog
# MODEL_LOAD_ERROR on a real device. Both origins are added below so the AI
# model can actually load in production.
#
# 'wasm-unsafe-eval' in script-src: once the two origins above were added,
# the WASM runtime file itself downloaded fine, but WebAssembly.instantiate()
# was then blocked by CSP too -- Chrome treats compiling/instantiating a WASM
# module as covered by script-src's eval restriction, confirmed again via
# bgDebugLog MODEL_LOAD_ERROR on a real device ("violates ... because
# 'unsafe-eval' is not an allowed source of script"). 'wasm-unsafe-eval' is
# the narrow, WASM-only token (Chrome 91+/Firefox 106+/Safari 16.4+) that
# permits exactly this without permitting eval()/Function() of arbitrary JS
# strings, so it does not reopen the XSS risk the plain 'unsafe-eval' token
# would.
#
# BUG FIX (2026-09-06 -- Google Sign-In failing with auth/internal-error on
# every browser, right after picking a Google account): the exact same
# "silently blocked by CSP, no network attempt even made" class of bug this
# comment block already documents twice above -- just never applied to
# Firebase Auth's OWN internal requests. signInWithPopup/signInWithRedirect
# use Firebase's default browserPopupRedirectResolver, which:
#   1. loads https://apis.google.com/js/api.js as a <script> tag to set up
#      Google's cross-origin "gapi.iframes" relay -- this origin was missing
#      from script-src, so the browser blocked the script outright;
#   2. opens a hidden same-purpose iframe at the project's authDomain
#      (https://toolflight-invoice.firebaseapp.com/__/auth/iframe) to track
#      the popup/redirect handshake -- frame-src was never set at all, so it
#      fell back to default-src 'self', which blocks ANY cross-origin iframe,
#      including Firebase's own.
# Both failures happen entirely on our own origin, after control has already
# returned from Google's side -- which is exactly why Google's account
# picker always worked fine, the API key/OAuth client/consent-screen configs
# all checked out, and yet sign-in still died right after account selection,
# identically on every browser (a site-wide CSP header, not a browser
# quirk). securetoken.googleapis.com is added to connect-src for the same
# reason: it's the Token Service API endpoint Firebase Auth calls to
# exchange/refresh the session token right after this handshake completes,
# and it was missing too.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://www.gstatic.com https://cdn.jsdelivr.net https://unpkg.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://open.er-api.com https://api.exchangerate-api.com https://toolflight-pdf2word.onrender.com https://cdn.jsdelivr.net https://storage.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; frame-ancestors 'none';"
